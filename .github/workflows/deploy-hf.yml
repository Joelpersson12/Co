name: Deploy to Hugging Face Space

on:
  push:
    branches: [claude/framer-inspired-website-nibn47, main]
    paths: ['huggingface/**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push huggingface/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::error::Engångsinställning saknas: lägg till secret HF_TOKEN och variabel HF_SPACE (t.ex. dittnamn/moms) under Settings → Secrets and variables → Actions."
            exit 1
          fi
          HF_USER="${HF_SPACE%%/*}"
          cd huggingface
          git init -b main
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy from GitHub ${GITHUB_SHA::7}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
